<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Select</title>
  <meta name="description" content="Five small games in one cartridge. Pick one." />
  <style>
    :root { --bg: #000000; --navy: #202040; --ink: #ffffff; --grey: #707070; --lt: #c8c8c8; --gold: #e8ea4a; --mint: #58f5b1; --red: #e03c32; --purple: #340058; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100%; }
    html { overflow-y: scroll; } /* reserve the scrollbar from the start so the shelf never reflows mid-session */
    body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; user-select: none; }
    /* Everything is drawn at a logical 1x and scaled up by an integer, like the games. */
    #screen { --s: 3; image-rendering: pixelated; display: flex; flex-direction: column; align-items: center; }
    canvas.t { display: block; image-rendering: pixelated; }
    .title { margin: 8px 0 22px; }
    .shelf { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(10px * var(--s)); max-width: calc(5 * 84px * var(--s)); }
    .cart { width: calc(74px * var(--s)); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: calc(4px * var(--s)); }
    .shell { position: relative; width: calc(74px * var(--s)); height: calc(70px * var(--s)); background: var(--navy); border: calc(1px * var(--s)) solid var(--ink); box-shadow: inset 0 0 0 calc(1px * var(--s)) var(--bg); }
    .shell::before { /* cartridge grip ridges */ content: ""; position: absolute; left: calc(4px * var(--s)); right: calc(4px * var(--s)); bottom: calc(3px * var(--s)); height: calc(5px * var(--s)); background: repeating-linear-gradient(90deg, var(--bg) 0 calc(1px * var(--s)), transparent calc(1px * var(--s)) calc(3px * var(--s))); }
    .label { position: absolute; left: calc(4px * var(--s)); top: calc(4px * var(--s)); width: calc(64px * var(--s)); height: calc(48px * var(--s)); background: var(--purple); border: calc(1px * var(--s)) solid var(--bg); overflow: hidden; }
    .label img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .cart.dark .shell { background: #0c0c14; border-color: var(--grey); }
    .cart.dark .label { background: #000; display: flex; align-items: center; justify-content: center; }
    .cart.dark .label canvas { opacity: .9; }
    .cart.dark .shell::before { background: repeating-linear-gradient(90deg, #000 0 calc(1px * var(--s)), transparent calc(1px * var(--s)) calc(3px * var(--s))); }
    .cart .num { position: absolute; right: calc(4px * var(--s)); top: calc(56px * var(--s)); }
    .cart.sel .shell { border-color: var(--gold); box-shadow: inset 0 0 0 calc(1px * var(--s)) var(--bg), 0 0 0 calc(1px * var(--s)) var(--gold); }
    .cart.sel.blink .shell { border-color: var(--ink); box-shadow: inset 0 0 0 calc(1px * var(--s)) var(--bg), 0 0 0 calc(1px * var(--s)) var(--ink); }
    .info { margin-top: calc(10px * var(--s)); min-height: calc(30px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(3px * var(--s)); }
    .hint { margin-top: calc(10px * var(--s)); opacity: .8; display: flex; flex-wrap: wrap; justify-content: center; gap: calc(2px * var(--s)) calc(12px * var(--s)); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .cart:focus-visible { outline: none; }
    .cart { color: inherit; text-decoration: none; }
    .nofont canvas.t { display: none; } .nofont .sr { position: static; width: auto; height: auto; clip: auto; font: 16px/1.4 ui-monospace, monospace; }
    .hint a { color: inherit; }
    @media (max-width: 760px) { #screen { --s: 2; } }
    @media (max-width: 420px) { #screen { --s: 2; } body { padding-left: 4px; padding-right: 4px; } .shelf { max-width: calc(2 * 84px * var(--s)); gap: calc(6px * var(--s)); } }
  </style>
</head>
<body>
<div id="screen">
  <h1 class="title"><canvas class="t" data-text="SELECT A GAME" data-scale="2" data-color="#e8ea4a" aria-hidden="true"></canvas><span class="sr">Select a game</span></h1>
  <div class="shelf" id="shelf" role="list" aria-label="Games"></div>
  <div class="info" id="info" aria-live="polite"></div>
  <div class="hint" aria-hidden="true"><canvas class="t" data-text="ARROWS OR TAP" data-color="#707070"></canvas><canvas class="t" data-text="ENTER PLAYS" data-color="#707070"></canvas><canvas class="t" data-text="I MANUAL" data-color="#707070"></canvas></div>
</div>

<script>
  // The five slots. A slot with no `play` is a dark cartridge: under construction.
  const GAMES = [
    { title: 'GAHD THE YAHD', blurb: 'TOWER DEFENSE, HAHVAHD YAHD', cover: 'covers/yard.png', play: 'games/yard/play.html', manual: 'games/yard/index.html' },
    { title: 'UNDER CONSTRUCTION' },
    { title: 'UNDER CONSTRUCTION' },
    { title: 'UNDER CONSTRUCTION' },
    { title: 'UNDER CONSTRUCTION' },
  ];

  // Bitmap text: the games' own 5x7 font (sprites/font.png, art/gen_font.py), drawn
  // onto a canvas per label and scaled by the screen's integer factor in CSS.
  const CHARS = ' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const font = new Image();
  font.src = 'shared/font.png';
  // If the font image can't load, fall back to real text (the .sr spans become visible).
  const fontReady = new Promise((r) => { font.onload = r; font.onerror = () => { document.body.classList.add('nofont'); r(); }; });
  async function drawText(canvas, text, color = '#ffffff', scale = 1) {
    await fontReady;
    if (!font.naturalWidth) return canvas;
    text = String(text).toUpperCase();
    const w = text.length * 6, h = 8;
    canvas.width = w; canvas.height = h;
    canvas.style.width = `calc(${w * scale}px * var(--s))`;
    canvas.style.height = `calc(${h * scale}px * var(--s))`;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < text.length; i++) {
      const k = CHARS.indexOf(text[i]);
      if (k >= 0) ctx.drawImage(font, k * 6, 0, 6, 8, i * 6, 0, 6, 8);
    }
    // Recolor: the font is white on transparent.
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, w, h);
    return canvas;
  }
  function label(text, color, scale = 1) {
    const wrap = document.createElement('span');
    const c = document.createElement('canvas');
    c.className = 't';
    c.setAttribute('aria-hidden', 'true');
    drawText(c, text, color, scale);
    const sr = document.createElement('span');
    sr.className = 'sr';
    sr.textContent = text;
    wrap.append(c, sr);
    return wrap;
  }
  document.querySelectorAll('canvas.t[data-text]').forEach((c) => drawText(c, c.dataset.text, c.dataset.color || '#ffffff', +(c.dataset.scale || 1)));

  // Chip blips for moving and picking, on a square wave.
  let actx;
  function blip(f, dur = 0.05, type = 'square') {
    try {
      actx ??= new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.value = 0.08; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch {}
  }

  const shelf = document.getElementById('shelf');
  const info = document.getElementById('info');
  const carts = GAMES.map((g, i) => {
    // A real link for the playable ones, so Tab and screen readers find the game.
    const el = document.createElement(g.play ? 'a' : 'div');
    if (g.play) { el.href = g.play; el.setAttribute('aria-label', `${g.title}: ${g.blurb}. Play`); }
    else { el.setAttribute('role', 'listitem'); el.setAttribute('aria-label', `Slot ${i + 1}: under construction`); }
    el.className = 'cart' + (g.play ? '' : ' dark');
    const shell = document.createElement('div');
    shell.className = 'shell';
    const lab = document.createElement('div');
    lab.className = 'label';
    if (g.cover) {
      const img = document.createElement('img');
      img.src = g.cover; img.alt = g.title;
      lab.appendChild(img);
    } else {
      lab.appendChild(label('??', '#707070', 2));
    }
    shell.appendChild(lab);
    const num = label(String(i + 1), g.play ? '#ffffff' : '#707070');
    num.classList.add('num');
    shell.appendChild(num);
    el.appendChild(shell);
    el.addEventListener('mouseenter', () => select(i));
    el.addEventListener('focus', () => select(i, false));
    el.addEventListener('click', (e) => {
      e.preventDefault();
      // On touch, the first tap only selects (so the title and blurb show); the second launches.
      if (lastPointer === 'touch' && sel !== i) { select(i); return; }
      select(i);
      go();
    });
    shelf.appendChild(el);
    return el;
  });

  let sel = 0;
  let lastPointer = 'mouse';
  document.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; try { actx?.resume(); } catch {} }, true);
  function select(i, sound = true) {
    const was = sel;
    sel = (i + GAMES.length) % GAMES.length;
    carts.forEach((c, k) => { c.classList.toggle('sel', k === sel); c.classList.remove('blink'); });
    blinkPhase = 0;
    const g = GAMES[sel];
    const big = window.innerWidth >= 760 ? 2 : 1; // the long titles don't fit a phone at 2x
    info.replaceChildren(label(g.title, g.play ? '#ffffff' : '#707070', big), label(g.blurb || (g.play ? '' : 'COMING SOON'), g.play ? '#58f5b1' : '#707070'));
    if (sound && was !== sel && navigator.userActivation?.hasBeenActive !== false) blip(g.play ? 660 : 220, 0.04);
  }
  // Up/down go by where the carts actually are (the shelf wraps 5 / 3+2 / 2+2+1 by
  // width): the nearest cart in the next row in that direction, wrapping around.
  function vertical(dir) {
    const me = carts[sel].getBoundingClientRect();
    const rows = [...new Set(carts.map((c) => Math.round(c.getBoundingClientRect().top)))].sort((a, b) => a - b);
    if (rows.length === 1) return sel;
    const r = rows.indexOf(Math.round(me.top));
    const target = rows[(r + dir + rows.length) % rows.length];
    let best = sel, bestD = Infinity;
    carts.forEach((c, k) => {
      const b = c.getBoundingClientRect();
      if (Math.round(b.top) !== target) return;
      const d = Math.abs(b.left + b.width / 2 - (me.left + me.width / 2));
      if (d < bestD) { bestD = d; best = k; }
    });
    return best;
  }
  function go() {
    const g = GAMES[sel];
    if (!g.play) { blip(110, 0.15); return; }
    blip(880, 0.08); setTimeout(() => blip(1320, 0.12), 70);
    setTimeout(() => { location.href = g.play; }, 220);
  }
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowright' || k === 'd') select(sel + 1);
    else if (k === 'arrowleft' || k === 'a') select(sel - 1);
    else if (k === 'arrowdown' || k === 's') select(vertical(1));
    else if (k === 'arrowup' || k === 'w') select(vertical(-1));
    else if (k === 'enter' || k === ' ' || k === 'j' || k === 'x') go();
    else if (k === 'i' && GAMES[sel].manual) location.href = GAMES[sel].manual;
    else return;
    e.preventDefault();
  });
  // The cursor blinks, NES style; the phase resets on every move so the cursor lands gold.
  let blinkPhase = 0;
  setInterval(() => { blinkPhase ^= 1; carts[sel].classList.toggle('blink', blinkPhase === 1); }, 400);
  window.addEventListener('resize', () => select(sel, false));
  select(0, false);
</script>
</body>
</html>
